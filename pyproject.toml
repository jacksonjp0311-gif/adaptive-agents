[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-agents"
version = "0.1.1"
description = "Host-driven ephemeral task agents with durable evidence and scoped lessons"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
adaptive-agents = "adaptive_agents.__main__:main"

[tool.setuptools.packages.find]
include = ["adaptive_agents*"]
